<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm - Emesiobi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="main" id="main-display">
            <img id="largeImage" src="images/transparent.jpg" alt="Large Cat">
        </div>

        <div class="right">
            <div class="image-box">

                <div class="image-container">
                    <img src="images/cat1.jpg" alt="cat1" class="thumbnail" data-large="images/cat1.jpg" title="Cat 1">
                </div>

                <div class="image-container">
                    <img src="images/cat2.jpg" alt="cat2" class="thumbnail" data-large="images/cat2.jpg" title="cat2: click me to see more">
                </div>

                <div class="image-container">
                    <img src="images/cat3.jpg" alt="cat3" class="thumbnail" data-large="images/cat3.jpg" title="Cat 3">
                </div>

                <div class="image-container">
                    <img src="images/cat4.jpg" alt="cat4" class="thumbnail" data-large="images/cat4.jpg" title="Cat 4">
                </div>

            </div>
        </div>

        <div class="footer">
            Midterm - Winter 2026 - Emesiobi
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
